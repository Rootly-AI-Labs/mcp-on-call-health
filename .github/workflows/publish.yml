name: Publish

# Manual release: build, publish to PyPI (trusted publishing), then publish the
# server.json entry to the MCP Registry. Nothing here runs automatically.
on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the wheel/sdist to PyPI"
        type: boolean
        default: true
      publish_registry:
        description: "Publish server.json to the MCP Registry"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Check versions match
        run: |
          PY=$(uv version --short)
          SJ=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          PK=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "pyproject=$PY server.json=$SJ package=$PK"
          test "$PY" = "$SJ" && test "$PY" = "$PK"

      - name: Run tests
        run: |
          uv sync --frozen --extra test --extra server
          uv run pytest tests/ -q -o addopts=""

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    if: ${{ inputs.publish_pypi }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  registry:
    if: ${{ inputs.publish_registry }}
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
