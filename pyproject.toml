[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "oncallhealth-mcp"
version = "0.4.1"
description = "MCP server for On-Call Health burnout analysis"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "On-Call Health", email = "support@oncallhealth.ai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mcp", "on-call", "health", "burnout", "analysis"]
dependencies = [
    "fastmcp[code-mode,tasks]>=4.1.5,<5",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "aiobreaker>=1.2.0",
    "pydantic>=2.12.0",
]

[project.urls]
Homepage = "https://oncallhealth.ai"
Repository = "https://github.com/Rootly-AI-Labs/mcp-on-call-health"
Issues = "https://github.com/Rootly-AI-Labs/mcp-on-call-health/issues"
Documentation = "https://oncallhealth.ai/docs/mcp"

[project.scripts]
oncallhealth-mcp = "oncallhealth_mcp.cli:main"

[project.optional-dependencies]
server = [
    "uvicorn[standard]>=0.30.0",
    "starlette>=1.0.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oncallhealth_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B008: FastMCP injects dependencies through call defaults (CurrentContext(), Progress())
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.10"
files = ["src/oncallhealth_mcp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=oncallhealth_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
]
